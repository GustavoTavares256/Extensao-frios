<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Extensão CodXis</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="codxis-popup">
    <h1 class="codxis-popup__titulo">Extensão CodXis</h1>
    <p class="codxis-popup__status" id="codxis-status">Verificando aba...</p>
    <label class="codxis-popup__opcao">
      <input type="checkbox" id="codxis-visivel" checked />
      <span>Mostrar extensão nas páginas do CodXis</span>
    </label>
    <label class="codxis-popup__opcao">
      <input type="checkbox" id="codxis-debug" />
      <span>Logs detalhados no Console (F12)</span>
    </label>
    <p class="codxis-popup__versao">v1.0.0 — etapas 1-8</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
